name: build

on:
  push:
    tags:
      - 'v*'
env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          #          - platform: windows
          #            os: windows-11-arm
          #            arch: arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Branding Config
        shell: bash
        run: |
          mkdir -p assets/config
          echo "${{ secrets.XBOARD_CONFIG }}" | base64 --decode > assets/config/xboard.config.yaml

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          if [ -n "${{ secrets.SERVICE_JSON }}" ]; then
            echo "${{ secrets.SERVICE_JSON }}" | base64 --decode > android/app/google-services.json
          fi
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties

      - name: Cache Gradle Distribution
        if: startsWith(matrix.platform,'android')
        id: gradle-dist-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/gradle-8.13-bin.zip
            /tmp/gradle-plugins-repo
          key: gradle-dist-8.13-bin-v2

      - name: Download Gradle Distribution
        if: startsWith(matrix.platform,'android') && steps.gradle-dist-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Download Gradle distribution
          for url in \
            "https://services.gradle.org/distributions/gradle-8.13-bin.zip" \
            "https://downloads.gradle-dn.com/distributions/gradle-8.13-bin.zip"; do
            echo "Trying $url..."
            if curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors \
                 --connect-timeout 60 --max-time 600 \
                 -o /tmp/gradle-8.13-bin.zip "$url"; then
              echo "Downloaded Gradle distribution from $url"
              break
            fi
          done
          [ -f /tmp/gradle-8.13-bin.zip ] || { echo "Gradle download failed"; exit 1; }

          # Download kotlin-dsl plugin artifacts from Gradle Plugin Portal
          KDSL_VER=5.2.0
          REPO=/tmp/gradle-plugins-repo
          PORTAL="https://plugins.gradle.org/m2"

          # Marker POM (content is known, create directly as fallback)
          MARKER_DIR="$REPO/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/${KDSL_VER}"
          mkdir -p "$MARKER_DIR"
          cat > "$MARKER_DIR/org.gradle.kotlin.kotlin-dsl.gradle.plugin-${KDSL_VER}.pom" << 'MARKERPOM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.gradle.kotlin.kotlin-dsl</groupId>
            <artifactId>org.gradle.kotlin.kotlin-dsl.gradle.plugin</artifactId>
            <version>5.2.0</version>
            <packaging>pom</packaging>
            <dependencies>
              <dependency>
                <groupId>org.gradle.kotlin</groupId>
                <artifactId>gradle-kotlin-dsl-plugins</artifactId>
                <version>5.2.0</version>
              </dependency>
            </dependencies>
          </project>
          MARKERPOM

          # Implementation JAR + POM
          IMPL_DIR="$REPO/org/gradle/kotlin/gradle-kotlin-dsl-plugins/${KDSL_VER}"
          mkdir -p "$IMPL_DIR"

          echo "Downloading kotlin-dsl implementation JAR..."
          curl -fsSL --retry 10 --retry-delay 10 --retry-all-errors \
               --connect-timeout 30 --max-time 300 -L \
               -o "$IMPL_DIR/gradle-kotlin-dsl-plugins-${KDSL_VER}.jar" \
               "${PORTAL}/org/gradle/kotlin/gradle-kotlin-dsl-plugins/${KDSL_VER}/gradle-kotlin-dsl-plugins-${KDSL_VER}.jar" || {
            echo "WARNING: Could not download kotlin-dsl JAR from Plugin Portal"
            exit 1
          }

          echo "Downloading kotlin-dsl implementation POM..."
          curl -fsSL --retry 10 --retry-delay 10 --retry-all-errors \
               --connect-timeout 30 --max-time 120 -L \
               -o "$IMPL_DIR/gradle-kotlin-dsl-plugins-${KDSL_VER}.pom" \
               "${PORTAL}/org/gradle/kotlin/gradle-kotlin-dsl-plugins/${KDSL_VER}/gradle-kotlin-dsl-plugins-${KDSL_VER}.pom" || {
            echo "WARNING: Could not download POM, creating minimal POM"
            cat > "$IMPL_DIR/gradle-kotlin-dsl-plugins-${KDSL_VER}.pom" << 'IMPLPOM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.gradle.kotlin</groupId>
            <artifactId>gradle-kotlin-dsl-plugins</artifactId>
            <version>5.2.0</version>
          </project>
          IMPLPOM
          }

          # ====== Kotlin JVM 1.9.20 marker (for Flutter SDK included build) ======
          KJVM_DIR="$REPO/org/jetbrains/kotlin/jvm/org.jetbrains.kotlin.jvm.gradle.plugin/1.9.20"
          mkdir -p "$KJVM_DIR"
          cat > "$KJVM_DIR/org.jetbrains.kotlin.jvm.gradle.plugin-1.9.20.pom" << 'KJVMPOM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.jetbrains.kotlin.jvm</groupId>
            <artifactId>org.jetbrains.kotlin.jvm.gradle.plugin</artifactId>
            <version>1.9.20</version>
            <packaging>pom</packaging>
            <dependencies>
              <dependency>
                <groupId>org.jetbrains.kotlin</groupId>
                <artifactId>kotlin-gradle-plugin</artifactId>
                <version>1.9.20</version>
              </dependency>
            </dependencies>
          </project>
          KJVMPOM

          # ====== AGP 8.12.2 marker ======
          AGP_DIR="$REPO/com/android/application/com.android.application.gradle.plugin/8.12.2"
          mkdir -p "$AGP_DIR"
          cat > "$AGP_DIR/com.android.application.gradle.plugin-8.12.2.pom" << 'AGPPOM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.android.application</groupId>
            <artifactId>com.android.application.gradle.plugin</artifactId>
            <version>8.12.2</version>
            <packaging>pom</packaging>
            <dependencies>
              <dependency>
                <groupId>com.android.tools.build</groupId>
                <artifactId>gradle</artifactId>
                <version>8.12.2</version>
              </dependency>
            </dependencies>
          </project>
          AGPPOM

          # ====== Kotlin Android 2.2.10 marker ======
          KA_DIR="$REPO/org/jetbrains/kotlin/android/org.jetbrains.kotlin.android.gradle.plugin/2.2.10"
          mkdir -p "$KA_DIR"
          cat > "$KA_DIR/org.jetbrains.kotlin.android.gradle.plugin-2.2.10.pom" << 'KAPOM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.jetbrains.kotlin.android</groupId>
            <artifactId>org.jetbrains.kotlin.android.gradle.plugin</artifactId>
            <version>2.2.10</version>
            <packaging>pom</packaging>
            <dependencies>
              <dependency>
                <groupId>org.jetbrains.kotlin</groupId>
                <artifactId>kotlin-gradle-plugin</artifactId>
                <version>2.2.10</version>
              </dependency>
            </dependencies>
          </project>
          KAPOM

          # ====== Google Services 4.3.15 marker ======
          GS_DIR="$REPO/com/google/gms/google-services/com.google.gms.google-services.gradle.plugin/4.3.15"
          mkdir -p "$GS_DIR"
          cat > "$GS_DIR/com.google.gms.google-services.gradle.plugin-4.3.15.pom" << 'GSPOM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.google.gms.google-services</groupId>
            <artifactId>com.google.gms.google-services.gradle.plugin</artifactId>
            <version>4.3.15</version>
            <packaging>pom</packaging>
            <dependencies>
              <dependency>
                <groupId>com.google.gms</groupId>
                <artifactId>google-services</artifactId>
                <version>4.3.15</version>
              </dependency>
            </dependencies>
          </project>
          GSPOM

          # ====== Firebase Crashlytics 2.8.1 marker ======
          FC_DIR="$REPO/com/google/firebase/crashlytics/com.google.firebase.crashlytics.gradle.plugin/2.8.1"
          mkdir -p "$FC_DIR"
          cat > "$FC_DIR/com.google.firebase.crashlytics.gradle.plugin-2.8.1.pom" << 'FCPOM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.google.firebase.crashlytics</groupId>
            <artifactId>com.google.firebase.crashlytics.gradle.plugin</artifactId>
            <version>2.8.1</version>
            <packaging>pom</packaging>
            <dependencies>
              <dependency>
                <groupId>com.google.firebase</groupId>
                <artifactId>firebase-crashlytics-gradle</artifactId>
                <version>2.8.1</version>
              </dependency>
            </dependencies>
          </project>
          FCPOM

          echo "All plugin marker POMs created:"
          find "$REPO" -type f -exec ls -la {} \;

      - name: Configure Gradle Wrapper
        if: startsWith(matrix.platform,'android')
        shell: bash
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=file\\:///tmp/gradle-8.13-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          # Remove local proxy settings that don't work on CI
          sed -i '/systemProp\.http\.proxyHost/d' android/gradle.properties
          sed -i '/systemProp\.http\.proxyPort/d' android/gradle.properties
          sed -i '/systemProp\.https\.proxyHost/d' android/gradle.properties
          sed -i '/systemProp\.https\.proxyPort/d' android/gradle.properties

      - name: Configure Gradle Mirrors
        if: startsWith(matrix.platform,'android')
        shell: bash
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirrors.init.gradle << 'INITEOF'
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      maven { url '/tmp/gradle-plugins-repo' }
                      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                      maven { url 'https://maven.aliyun.com/repository/google' }
                      maven { url 'https://maven.aliyun.com/repository/central' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                      gradlePluginPortal()
                      google()
                      mavenCentral()
                  }
              }
          }
          INITEOF

      - name: Setup Gradle
        if: startsWith(matrix.platform,'android')
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        if: ${{ !(startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true
      - name: Setup Flutter With Other
        if: startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        run: dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  changelog:
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        if: ${{ env.IS_STABLE == 'true' }}
        with:
          fetch-depth: 0
          ref: refs/heads/main
      - name: Generate
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          last_ver=$(grep -m1 '^## ' CHANGELOG.md 2>/dev/null | sed 's/^## //')
          
          tags=($(git tag --merged HEAD --sort=-creatordate))
          
          temp="NEW_CHANGELOG.md" > "$temp"
          
          for i in "${!tags[@]}"; do
              curr="${tags[i]}"
              [[ "$curr" == "$last_ver" ]] && break
          
              prev="${tags[i+1]}"
              range="${prev:+$prev..}$curr"
          
              echo -e "## $curr\n" >> "$temp"
              git log --no-merges --pretty=format:"%B" "$range" | \
              awk '!/Update changelog/ && NF {print "- " $0 "\n"}' >> "$temp"
          done
          [ -f CHANGELOG.md ] && cat CHANGELOG.md >> "$temp"
          
          mv "$temp" CHANGELOG.md

      - name: Commit
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            echo "Commit pushing"
            git config --local user.email "chen08209@gmail.com"
            git config --local user.name "chen08209"
            git commit -m "Update changelog"
            git push
            if [ $? -eq 0 ]; then
              echo "Push succeeded"
            else
              echo "Push failed"
              exit 1
            fi
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    permissions: write-all
    needs: [ build ]
    runs-on: ubuntu-latest
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        ports:
          - 8081:8081
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release.md
        run: |
          tags=($(git tag --merged HEAD --sort=-creatordate))
          preTag=$(curl -s "https://api.github.com/repos/chen08209/FlClash/releases/latest" | \
          sed -nE 's/.*"tag_name": "([^"]+)".*/\1/p')
          
          [ -z "$preTag" ] && preTag=""
          
          out="release.md" > "$out"
          
          for i in "${!tags[@]}"; do
            curr="${tags[i]}"
            [[ "$curr" == "$preTag" ]] && break
          
            prev="${tags[i+1]}"
            range="${prev:+$prev..}$curr"
          
            git log --no-merges --pretty=format:"%B" "$range" | \
            awk '!/Update changelog/ && NF {print "- " $0 "\n"}' >> "$out"
          done
      - name: Push to telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python -m pip install --upgrade pip
          pip install requests
          python release_telegram.py

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Generate sha256
        if: env.IS_STABLE == 'true'
        run: |
          cd ./dist
          for file in $(find . -type f -not -name "*.sha256"); do
            sha256sum "$file" > "${file}.sha256"
          done  

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: './release.md'

      - name: Create Fdroid Source Dir
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          mkdir -p ./tmp
          cp ./dist/*android-arm64-v8a* ./tmp/ || true
          echo "Files copied successfully"

      - name: Push to fdroid repo
        if: ${{ env.IS_STABLE == 'true' }}
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: ./tmp/
          destination-github-username: chen08209
          destination-repository-name: FlClash-fdroid-repo
          user-name: 'github-actions[bot]'
          user-email: 'github-actions[bot]@users.noreply.github.com'
          target-branch: main
          commit-message: Update from ${{ github.ref_name }}
          target-directory: /tmp/

